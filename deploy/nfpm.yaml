# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

name: tesor
arch: ${ARCH}
version: ${VERSION}
license: AGPL-3.0-or-later
platform: linux
# Keep package payloads reproducible across retries of the same release.
mtime: 1970-01-01T00:00:00Z
maintainer: Nikolay Govorov <me@govorov.online>
description: Tiny packages caching proxy

contents:
  - src: ./LICENSE
    dst: /usr/share/doc/tesor/LICENSE
  - src: ./README.md
    dst: /usr/share/doc/tesor/README.md

  - src: target/release/tesor
    dst: /usr/local/bin/tesor
    file_info:
      mode: 0755

  - src: deploy/tesor.toml
    dst: /etc/tesor.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: tesor

  - src: deploy/tesor.service
    dst: /usr/lib/systemd/system/tesor.service
    packager: deb
    file_info:
      mode: 0644
  - src: deploy/tesor.service
    dst: /usr/lib/systemd/system/tesor.service
    packager: rpm
    file_info:
      mode: 0644
  - src: deploy/tesor.initd
    dst: /etc/init.d/tesor
    packager: apk
    file_info:
      mode: 0755

  - dst: /var/lib/tesor
    type: dir
    file_info:
      mode: 0755
      owner: root
      group: tesor


scripts:
  preinstall: deploy/scripts/preinstall.sh
  postinstall: deploy/scripts/postinstall.sh
  preremove: deploy/scripts/preremove.sh

deb:
  signature:
    method: debsign
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

rpm:
  group: System Environment/Daemons
  signature:
    key_id: ${GPG_KEY_ID}
    key_file: ${SIGNING_PRIVATE_KEY}

apk:
  signature:
    key_file: ${APK_SIGNING_KEY}
    # nFPM appends ".rsa.pub". Keep the generation in the basename so clients
    # can retain historical package keys during signing-key rotation.
    key_name: packages.${PACKAGE_KEY_VERSION}
