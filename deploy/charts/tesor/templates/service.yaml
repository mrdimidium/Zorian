apiVersion: v1
kind: Service
metadata:
  name: {{ include "tesor.fullname" . }}
  labels:
    {{- include "tesor.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "tesor.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

